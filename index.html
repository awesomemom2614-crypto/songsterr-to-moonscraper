<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Songsterr drums to Moonscraper</title>
<style>
:root{--bg:#e8ecef;--ink:#16202b;--mut:#5b6672;--pn:#fff;--ac:#2456e5;--ln:#c9d1d8}
@media(prefers-color-scheme:dark){:root{--bg:#141a21;--ink:#e6ebef;--mut:#93a0ad;--pn:#1d2630;--ac:#6f95ff;--ln:#33404d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:34rem;margin:0 auto;padding:2rem 1.25rem 3rem}
h1{font-size:1.6rem;line-height:1.2;margin:.6rem 0 .5rem;letter-spacing:-.01em}
p{color:var(--mut);margin:0 0 1.4rem}
.lanes{display:flex;gap:6px}.lanes i{width:26px;height:8px;border-radius:4px}
label{display:block;font-weight:600;margin:0 0 1rem}
input[type=file],input[type=number]{display:block;width:100%;margin-top:.35rem;padding:.6rem;border:1px solid var(--ln);border-radius:8px;background:var(--pn);color:var(--ink);font:inherit;font-weight:400}
button{font:inherit;font-weight:600;padding:.65rem 1.1rem;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer}
button.alt{background:var(--pn);color:var(--ink);border:1px solid var(--ln)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}
section{margin-top:1.6rem;padding:1.1rem;background:var(--pn);border-radius:12px}
dl{display:grid;grid-template-columns:1fr auto;gap:.3rem 1rem;margin:0 0 1rem}dt{color:var(--mut)}dd{margin:0;font-weight:600}
#msg{margin-top:1rem;color:#c2410c;min-height:1.5em}
small{color:var(--mut);display:block;margin-top:.4rem;font-weight:400}
canvas{width:100%;height:auto;display:block;margin-top:.4rem}
</style></head><body><main>
<div class="lanes" aria-hidden="true"><i style="background:#f28b1e"></i><i style="background:#d93a3a"></i><i style="background:#e8c81c"></i><i style="background:#2f6fe0"></i><i style="background:#2fae5b"></i></div>
<h1>Songsterr drums to Moonscraper</h1>
<p>Choose the Songsterr MIDI and the song's MP3. You get a pro drums Expert <b>notes.mid</b> that lines up with the audio.</p>
<label>Songsterr MIDI file<input type="file" id="mid" accept=".mid,.midi"></label>
<label>Song MP3<input type="file" id="mp3" accept="audio/*,.mp3"></label>
<button id="go">Analyze</button>
<div id="msg" role="status"></div>
<section id="res" hidden>
<dl id="stats"></dl>
<label>Audio start (seconds)<input type="number" id="off" step="0.001" min="0"><small>Detected as the first sound in the MP3. Adjust it if the preview clicks sit early or late.</small></label>
<label>Preview from (seconds)<input type="number" id="from" step="0.5" min="0"></label>
<canvas id="viz" width="340" height="70" aria-label="Drum hits during preview"></canvas>
<div class="row"><button id="play" class="alt">Preview with clicks</button><button id="stop" class="alt">Stop</button></div>
<div class="row"><button id="dlz">Download notes.mid + song.ogg (.zip)</button><button id="dl" class="alt">notes.mid only</button></div>
<small>Both files start with 2 seconds of silence, as Clone Hero requires. Unzip into one song folder, then open notes.mid in Moonscraper.</small>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
let midi,buf,ctx,tm;
// GM drum note -> [expert lane note, optional pro tom marker]
const M={35:[96],36:[96],37:[97],38:[97],40:[97],42:[98],44:[98],46:[98],48:[98,110],50:[98,110],45:[99,111],47:[99,111],41:[100,112],43:[100,112],51:[99],53:[99],59:[99],49:[100],52:[100],57:[100]};
const msg=t=>$('msg').textContent=t;

function parseMidi(b){
 const u=new Uint8Array(b),dv=new DataView(b),n=dv.getUint16(10),ppq=dv.getUint16(12);
 let p=14,best=null;const o={ppq,tempos:[],sigs:[],notes:[]};
 for(let t=0;t<n;t++){
  const end=p+8+dv.getUint32(p+4);let q=p+8,tick=0,rs=0,c9=0;const nt=[];p=end;
  while(q<end){
   let v=0,x;do{x=u[q++];v=(v<<7)|(x&127)}while(x&128);tick+=v;
   const s=u[q];
   if(s===255){const ty=u[q+1],l=u[q+2],d=u.slice(q+3,q+3+l);q+=3+l;
    if(ty===0x51)o.tempos.push([tick,(d[0]<<16)|(d[1]<<8)|d[2]]);
    else if(ty===0x58)o.sigs.push([tick,d[0],d[1]]);}
   else if(s===240||s===247){q+=2+u[q+1]}
   else{if(s&128){rs=s;q++}const hi=rs>>4,a=u[q++];let c=0;if(hi!==12&&hi!==13)c=u[q++];
    if(hi===9&&c>0){nt.push([tick,a]);if((rs&15)===9)c9++}}
  }
  if(c9&&(!best||c9>best.c))best={c:c9,nt};
 }
 o.notes=best?best.nt:[];return o;
}
function tmap(o){
 const m=new Map();o.tempos.forEach(([t,us])=>m.set(T(t),us));
 if(!m.has(0))m.set(0,500000);
 const ev=[...m].sort((a,b)=>a[0]-b[0]);let s=0;
 return ev.map(([t,us],i)=>{if(i)s+=(t-ev[i-1][0])/192*ev[i-1][1]/1e6;return{t,us,s}});
}
const T=t=>Math.round(t*192/midi.ppq);
function sec(t){let e=tm[0];for(const x of tm){if(x.t>t)break;e=x}return e.s+(t-e.t)/192*e.us/1e6}
function firstSound(ab){
 const x=ab.getChannelData(0),h=512,n=Math.floor(x.length/h),r=new Float32Array(n);let pk=0;
 for(let i=0;i<n;i++){let s=0;for(let j=0;j<h;j++){const v=x[i*h+j];s+=v*v}r[i]=Math.sqrt(s/h);if(r[i]>pk)pk=r[i]}
 for(let i=0;i<n;i++)if(r[i]>pk*0.03)return Math.max(0,(i-1)*h/ab.sampleRate);
 return 0;
}
const us3=u=>[u>>16&255,u>>8&255,u&255];
const meta=(t,ty,d)=>[t,0,[255,ty,d.length,...d]];
const vlq=n=>{const a=[n&127];while(n>>=7)a.unshift(n&127|128);return a};
function chunk(evs){
 evs.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);let l=0;const d=[];
 for(const[t,,b]of evs){for(const x of vlq(t-l))d.push(x);for(const x of b)d.push(x);l=t}
 d.push(0,255,47,0);const n=d.length;
 return[77,84,114,107,n>>24&255,n>>16&255,n>>8&255,n&255,...d];
}
function build(o){
 // A lead-in of whole 4/4 bars makes tick 0 the start of the MP3.
 const L=o>=.05?768*Math.max(1,Math.round(o/2)):0,e0=[],e1=[];
 if(L){e0.push(meta(0,0x51,us3(Math.round(o*1e6/(L/192)))),meta(0,0x58,[4,2,24,8]))}
 tm.forEach(e=>e0.push(meta(e.t+L,0x51,us3(e.us))));
 midi.sigs.forEach(([t,nn,dd])=>e0.push(meta(T(t)+L,0x58,[nn,dd,24,8])));
 if(!midi.sigs.length)e0.push(meta(L,0x58,[4,2,24,8]));
 e1.push(meta(0,3,[...'PART DRUMS'].map(c=>c.charCodeAt(0))));
 const seen=new Set();
 for(const[t,p]of midi.notes){
  const m=M[p];if(!m)continue;const a=T(t)+L,k=a+':'+m[0];if(seen.has(k))continue;seen.add(k);
  for(const n of m)e1.push([a,1,[0x90,n,100]],[a+12,0,[0x80,n,0]]);
 }
 return new Uint8Array([77,84,104,100,0,0,0,6,0,1,0,2,0,192,...chunk(e0),...chunk(e1)]);
}
function show(){
 const o=+$('off').value||0,n=midi.notes.filter(x=>M[x[1]]).length,f=o+sec(T(midi.notes[0][0]));
 $('stats').innerHTML=`<dt>Drum hits</dt><dd>${n}</dd><dt>Tempo changes</dt><dd>${tm.length}</dd><dt>First drum hit in the audio</dt><dd>${f.toFixed(2)} s</dd>`;
}
$('go').onclick=async()=>{
 try{
  const a=$('mid').files[0],b=$('mp3').files[0];
  if(!a||!b)return msg('Choose both a MIDI file and an MP3 first.');
  msg('Analyzing…');
  midi=parseMidi(await a.arrayBuffer());
  if(!midi.notes.length)return msg('No drum notes found. The MIDI needs a drum track on channel 10.');
  tm=tmap(midi);
  const ac=new AudioContext();buf=await ac.decodeAudioData(await b.arrayBuffer());ac.close();
  const o=firstSound(buf);$('off').value=o.toFixed(3);
  $('from').value=Math.max(0,o+sec(T(midi.notes[0][0]))-2).toFixed(1);
  show();$('res').hidden=false;msg('');
 }catch(e){msg('Could not read the files: '+e.message)}
};
$('off').oninput=()=>midi&&show();
const PAD=2,COL={96:'#f28b1e',97:'#d93a3a',98:'#e8c81c',99:'#2f6fe0',100:'#2fae5b'};
let hits=[],hi=0,raf;
function draw(){
 const c=$('viz'),g=c.getContext('2d'),now=ctx?ctx.currentTime:0,last={};
 while(hi<hits.length&&hits[hi][0]<now-.2)hi++;
 for(let j=hi;j<hits.length&&hits[j][0]<=now;j++)last[hits[j][1]]=hits[j];
 g.clearRect(0,0,c.width,c.height);g.lineWidth=5;
 [96,97,98,99,100].forEach((n,i)=>{
  const x=34+i*68,h=last[n],a=h?Math.max(0,1-(now-h[0])/.2):0;
  g.strokeStyle=g.fillStyle=COL[n];g.globalAlpha=.18;g.beginPath();g.arc(x,35,18,0,7);g.stroke();
  if(a>0){g.globalAlpha=a;g.beginPath();g.arc(x,35,16+10*a,0,7);h[2]?g.stroke():g.fill()}
 });
 g.globalAlpha=1;
 if(ctx)raf=requestAnimationFrame(draw);
}
function stop(){cancelAnimationFrame(raf);if(ctx){ctx.close();ctx=null}draw()}
$('stop').onclick=stop;
$('play').onclick=()=>{
 stop();const o=+$('off').value||0,f=+$('from').value||0;
 ctx=new AudioContext();const s=ctx.createBufferSource(),v=ctx.createGain();
 v.gain.value=.5;s.buffer=buf;s.connect(v);v.connect(ctx.destination);
 const b=ctx.currentTime+.2;s.start(b,f);hits=[];hi=0;
 for(const[t,p]of midi.notes){
  const m=M[p];if(!m)continue;const at=b+o+sec(T(t))-f;if(at<b)continue;
  hits.push([at,m[0],m[0]>97&&!m[1]]);
  const os=ctx.createOscillator(),g=ctx.createGain();os.type='square';os.frequency.value=m[0]===96?200:1500;
  g.gain.setValueAtTime(.5,at);g.gain.exponentialRampToValueAtTime(.001,at+.05);
  os.connect(g);g.connect(ctx.destination);os.start(at);os.stop(at+.06);
 }
 draw();
};
const cat=a=>{const o=new Uint8Array(a.reduce((s,x)=>s+x.length,0));let q=0;a.forEach(x=>{o.set(x,q);q+=x.length});return o};
const oggT=(()=>{const t=[];for(let i=0;i<256;i++){let r=i<<24;for(let j=0;j<8;j++)r=r&0x80000000?(r<<1)^0x04c11db7:r<<1;t.push(r>>>0)}return t})();
const zipT=(()=>{const t=[];for(let i=0;i<256;i++){let c=i;for(let j=0;j<8;j++)c=c&1?0xedb88320^(c>>>1):c>>>1;t.push(c>>>0)}return t})();
const crc32=d=>{let c=-1;for(const b of d)c=zipT[(c^b)&255]^(c>>>8);return(c^-1)>>>0};
const asc=s=>[...s].map(c=>c.charCodeAt(0));
function page(type,gran,seq,pk){
 const lac=[];pk.forEach(p=>{let l=p.length;while(l>=255){lac.push(255);l-=255}lac.push(l)});
 const o=new Uint8Array(27+lac.length+pk.reduce((a,p)=>a+p.length,0)),dv=new DataView(o.buffer);
 o.set([79,103,103,83,0,type]);dv.setUint32(6,gran,true);dv.setUint32(14,1,true);dv.setUint32(18,seq,true);
 o[26]=lac.length;o.set(lac,27);let q=27+lac.length;pk.forEach(p=>{o.set(p,q);q+=p.length});
 let c=0;for(const b of o)c=((c<<8)^oggT[(c>>>24)^b])>>>0;dv.setUint32(22,c,true);return o;
}
function ogg(pk){
 const hd=new Uint8Array(19),dv=new DataView(hd.buffer);
 hd.set(asc('OpusHead'));hd[8]=1;hd[9]=2;dv.setUint16(10,312,true);dv.setUint32(12,48000,true);
 const v=asc('song'),tg=new Uint8Array(16+v.length);
 tg.set(asc('OpusTags'));new DataView(tg.buffer).setUint32(8,v.length,true);tg.set(v,12);
 const out=[page(2,0,0,[hd]),page(0,0,1,[tg])];let i=0,g=0,seq=2;
 while(i<pk.length){const grp=pk.slice(i,i+30);i+=30;g+=grp.length*960;out.push(page(i>=pk.length?4:0,g,seq++,grp))}
 return cat(out);
}
async function toOgg(){
 const R=48000,n=Math.ceil((buf.duration+PAD)*R),oc=new OfflineAudioContext(2,n,R),s=oc.createBufferSource();
 s.buffer=buf;s.connect(oc.destination);s.start(PAD);
 const pcm=await oc.startRendering(),ch=[pcm.getChannelData(0),pcm.getChannelData(1)],pk=[];
 const enc=new AudioEncoder({output:c=>{const d=new Uint8Array(c.byteLength);c.copyTo(d);pk.push(d)},error:e=>{throw e}});
 enc.configure({codec:'opus',sampleRate:R,numberOfChannels:2,bitrate:160000});
 for(let i=0;i<n;i+=960){
  const k=Math.min(960,n-i),d=new Float32Array(1920);
  d.set(ch[0].subarray(i,i+k),0);d.set(ch[1].subarray(i,i+k),960);
  enc.encode(new AudioData({format:'f32-planar',sampleRate:R,numberOfFrames:960,numberOfChannels:2,timestamp:Math.round(i/R*1e6),data:d}));
  if(enc.encodeQueueSize>50)await new Promise(r=>setTimeout(r,0));
 }
 await enc.flush();return ogg(pk);
}
function zip(files){
 const loc=[],cen=[];let off=0;
 for(const[n,d]of files){
  const nm=new TextEncoder().encode(n),c=crc32(d),h=new DataView(new ArrayBuffer(30)),e=new DataView(new ArrayBuffer(46));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(12,0x21,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);
  e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(14,0x21,true);e.setUint32(16,c,true);e.setUint32(20,d.length,true);e.setUint32(24,d.length,true);e.setUint16(28,nm.length,true);e.setUint32(42,off,true);
  loc.push(new Uint8Array(h.buffer),nm,d);cen.push(new Uint8Array(e.buffer),nm);off+=30+nm.length+d.length;
 }
 const cs=cat(cen),z=new DataView(new ArrayBuffer(22));
 z.setUint32(0,0x06054b50,true);z.setUint16(8,files.length,true);z.setUint16(10,files.length,true);z.setUint32(12,cs.length,true);z.setUint32(16,off,true);
 return cat([...loc,cs,new Uint8Array(z.buffer)]);
}
function save(name,bytes,type){
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type}));a.download=name;a.click();
}
const mid=()=>build((+$('off').value||0)+PAD);
$('dl').onclick=()=>save('notes.mid',mid(),'audio/midi');
$('dlz').onclick=async()=>{
 if(!window.AudioEncoder)return msg('This browser cannot encode audio. Use a recent Chrome or Edge.');
 try{msg('Encoding audio…');save('song-package.zip',zip([['notes.mid',mid()],['song.ogg',await toOgg()]]),'application/zip');msg('')}
 catch(e){msg('Encoding failed: '+e.message)}
};
</script></body></html>
